<!DOCTYPE html>
<html lang="es">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

<meta charset="UTF-8">
<title>Mis Favoritos</title>
<link rel="stylesheet" href="chat.css">
<link rel="stylesheet" href="favoritos.css">

  <link rel="stylesheet" href="responsive.css">
</head>

<body>

<h1>⭐ Mis favoritos</h1>

<div id="listaFavoritos"></div>



<!-- CHAT -->
<div id="chatBox" class="chat-box">

<div class="chat-header">

<div>
💬 Chat sobre <span id="chatProductoNombre"></span>
</div>

<div class="chat-controles">
<span onclick="minimizarChat()">➖</span>
<span onclick="cerrarChat()">✖</span>
</div>

</div>

<div id="chatMensajes" class="chat-mensajes"></div>

<div class="chat-input">
<input type="text" id="mensajeInput" placeholder="Escribe un mensaje...">
<button onclick="enviarMensaje()">Enviar</button>
</div>

</div>


<script src="sesion.js"></script>
<script src="chat.js"></script>
<script src="favoritos.js"></script>

</body>
</html>
